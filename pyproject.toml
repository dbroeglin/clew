[project]
name = "clew"
version = "1.0.0"
description = "Workspace for autonomous, portable agent skills."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["playwright>=1.50,<2"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [".agents/skills/*"]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
