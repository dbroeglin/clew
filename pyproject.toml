[project]
name = "clew"
version = "1.0.0"
description = "Tools and agent skills for evidence-based personalized learning."
requires-python = ">=3.11"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2,<2",
    "azure-identity>=1.25,<2",
    "markdown-it-py>=3,<5",
    "mdit-py-plugins>=0.4,<1",
    "openai>=2,<4",
    "pillow>=11.3,<13",
    "pydantic>=2.11,<3",
    "pymupdf>=1.26,<2",
    "pyyaml>=6.0.2,<7",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
