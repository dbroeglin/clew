<!doctype html>
<html lang="{{UI:locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
(() => {
  const param = new URLSearchParams(window.location.search).get("scoutTheme");
  const theme =
    param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>{{STYLE}}</style>
<script>
window.MathJax = {
  loader: {load: []},
  tex: {
    packages: ['base', 'ams', 'newcommand', 'configmacros'],
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']],
    macros: {llbracket: '\\lbrack\\!\\lbrack', rrbracket: '\\rbrack\\!\\rbrack'}
  },
  svg: {fontCache: 'local'},
  startup: {typeset: false},
  options: {
    enableMenu: false,
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script>{{MATHJAX}}</script>
</head>
<body>
<header><p class="eyebrow">{{UI:app.eyebrow}}</p><h1>{{TITLE}}</h1></header>
<div id="error" role="alert" hidden></div>
<main class="workspace">
  <section class="sheet" aria-label="{{UI:app.sheet_label}}"><div id="reading"></div><div id="exercises"></div></section>
  <aside class="panel" aria-label="{{UI:app.panel_label}}">
    <button id="panel-back" type="button" hidden>{{UI:app.panel_back}}</button>
    <h2 id="panel-title" tabindex="-1">{{UI:app.panel_title}}</h2>
    <div id="panel-content" aria-live="polite">{{UI:app.panel_placeholder}}</div>
  </aside>
</main>
<noscript>{{UI:app.noscript}}</noscript>
<template id="template-course">
  <details>
    <summary data-slot="title"></summary>
    <div class="course-body" data-slot="body"></div>
  </details>
</template>
<template id="template-exercise">
  <details class="exercise">
    <summary>
      <span class="exercise-title" data-slot="title"></span>
      <button class="start" type="button" data-action="start">{{UI:app.start_exercise}}</button>
    </summary>
    <div class="exercise-body" data-slot="body">
      <div data-slot="context"></div>
    </div>
  </details>
</template>
<template id="template-question">
  <section class="question" data-slot="question">
    <span class="question-label" data-slot="label"></span>
    <div data-slot="statement"></div>
    <div class="actions" data-slot="actions">
      <button type="button" data-help="method">{{UI:app.method}}</button>
      <button type="button" data-help="hints">{{UI:app.hints}}</button>
    </div>
  </section>
</template>
<template id="template-course-link">
  <button type="button">{{UI:app.course_link}}<span data-slot="title"></span></button>
</template>
<template id="template-content">
  <div data-slot="content"></div>
</template>
<template id="template-method">
  <div>
    <p class="aid-label">{{UI:aid.method}}</p>
    <div data-slot="content"></div>
  </div>
</template>
<template id="template-hints">
  <div>
    <p class="aid-label">{{UI:aid.hints}}</p>
    <div data-slot="hints"></div>
    <button type="button" data-action="reveal">{{UI:aid.reveal}}</button>
  </div>
</template>
<template id="template-hint">
  <div class="hint" data-slot="hint"></div>
</template>
<template id="template-explanations">
  <div>
    <p class="aid-label">{{UI:aid.explanations}}</p>
    <div data-slot="explanations"></div>
  </div>
</template>
<template id="template-correction">
  <button type="button" data-action="correction" aria-expanded="false"
    data-label-open="{{UI:correction.open}}" data-label-close="{{UI:correction.close}}">{{UI:correction.open}}</button>
  <div class="correction" data-slot="correction" hidden>
    <p class="correction-title">{{UI:correction.title}}</p>
    <div data-slot="answers"></div>
    <div class="actions" data-slot="courses">
      <button type="button" data-help="explanations">{{UI:app.explanations}}</button>
    </div>
  </div>
</template>
<template id="licenses">{{LICENSE}}</template>
<script id="publication" type="application/json">{{DATA}}</script>
<script>{{SCRIPT}}</script>
</body>
</html>
